version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  # docker-compose.yml's slskd image. A bump changes the tag and the
  # digest together (observed on #11, then #13). Seeker never re-seeds
  # an install's own copy (HISTORY §140), so a bump here reaches new
  # installs only.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
