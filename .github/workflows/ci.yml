name: CI
on:
  push:
  pull_request:
  # A new advisory arrives without a commit; the weekly run reports it.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The only platform Qt UI tests are proven on (packaging, the stress
    # test, and every "confirmed live" comment in this codebase are all
    # macOS-specific). The full suite, Qt widget tests included, passes
    # headless under QT_QPA_PLATFORM=offscreen on a real Mac — no test
    # needs a real display, so nothing here is deselected.
    #
    # Pinned to a concrete image, not macos-latest, so a runner-image
    # change arrives as a reviewed commit rather than silently under an
    # unrelated push (`gh run view`'s "Runner Image" section shows what
    # macos-latest resolves to). Dependabot does not update this line;
    # bump it by hand.
    runs-on: macos-26
    # The weekly run is for the audit job alone.
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # A missing or unloadable libchromaprint fails the real-audio
      # tests instead of skipping them (tests/chromaprint_gate.py).
      SEEKER_REQUIRE_CHROMAPRINT: "1"
    steps:
      # No later step pushes, so the job token stays out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      # Unpinned on purpose: the fingerprint tests need a libchromaprint,
      # not a particular one, and CI's copy never ships (the app loads
      # the user's own Homebrew library).
      - run: brew install chromaprint
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check src tests tools
      - run: uv run mypy --strict src/
      # mypy decides `sys.platform` checks statically, so the run above
      # never checks an `if sys.platform == "win32":` body; this one does
      # (and skips the darwin ones). It goes by the platform it is told,
      # not the one it runs on, so it needs no Windows runner.
      - run: uv run mypy --strict --platform win32 src/
      - run: >-
          uv run pytest --cov=seeker --cov-branch --cov-report=term-missing
          --cov-fail-under=92

  check-intel:
    # The suite on real Intel hardware, which the Rosetta runs of
    # round 13 only approximate (Rosetta is not an Intel Mac). Blocking:
    # an Intel-only failure is the finding this job exists for. ruff and
    # mypy don't depend on the architecture and run in `check` alone, as
    # does the coverage gate. GitHub retires macos-15-intel in fall
    # 2027, its last Intel macOS image; after that Intel is tested under
    # Rosetta only (CLAUDE.md -> Commands) and this job goes.
    runs-on: macos-15-intel
    # The weekly run is for the audit job alone.
    if: github.event_name != 'schedule'
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      # The library lives under /usr/local on an Intel Mac: one the app
      # cannot find there must fail the tests, not skip them.
      SEEKER_REQUIRE_CHROMAPRINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      # Homebrew builds no bottles for Intel Macs any more: its copy
      # would compile ffmpeg and ten more formulae. The script builds
      # the one library the tests need, into /usr/local/lib, where the
      # app looks (and the Intel bundle stages it from).
      - run: packaging/build_chromaprint.sh
      - run: uv sync --locked --all-extras --dev
      # --durations lists the tests that took over a second: this
      # runner has failed two different tests on a short wait (HISTORY
      # §264, §265) and nothing else records whether it stalls.
      - run: uv run pytest -q --durations=25 --durations-min=1.0

  check-windows:
    # The suite on Windows, where it has never passed. Non-blocking
    # until it does: continue-on-error keeps this job's failure from
    # failing the run, and the change that makes the suite pass here
    # deletes that line. No libchromaprint is built for Windows yet, so
    # the fingerprint tests skip (tests/chromaprint_gate.py). ruff, both
    # mypy runs and the coverage gate run in `check` alone. Pinned for
    # the same reason as macos-26 above.
    runs-on: windows-2025
    # The weekly run is for the audit job alone.
    if: github.event_name != 'schedule'
    continue-on-error: true
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      # -rfEs adds each skip and its reason to the failures and errors
      # (-r replaces pytest's default fE, so both are spelled out);
      # --durations lists the tests that took over a second; a test
      # still running after five minutes dumps every thread's stack
      # (pytest's faulthandler), so a run the job's timeout kills still
      # names the test that hung.
      - run: >-
          uv run pytest -q -rfEs --durations=25 --durations-min=1.0
          -o faulthandler_timeout=300

  audit:
    # pip-audit over every locked dependency (tools/audit_dependencies.py
    # says what it can and cannot see). Linux, because it reads only
    # uv.lock; pinned for the same reason as macos-26 above.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv run --no-project --python 3.13 tools/audit_dependencies.py
