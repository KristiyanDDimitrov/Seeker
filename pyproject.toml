[project]
name = "seeker"
version = "0.1.0"
description = "Personal DJ music library management assistant"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "packaging>=26.3",
    "platformdirs>=4.11.4",
    "pyloudnorm>=0.1.1",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
seeker = "seeker.main:main"
seeker-ui = "seeker.main_ui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:seeker.*"]

[dependency-groups]
dev = [
    "dmgbuild>=1.6.7",
    "mypy>=2.3.1,<3",
    "psutil>=7.2.2",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.4,<0.17",
    "scipy-stubs>=1.18.1.0",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — real bugs
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade — this is a 3.13-only project
    "B",      # bugbear — real bug classes
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "SIM",    # simplifications
    "RET",    # return consistency
    "PTH",    # pathlib over os.path
    "DTZ",    # naive datetimes
    "RUF",    # ruff's own
    "S",      # bandit — security
    "PLC", "PLE", "PLW",  # pylint: convention/error/warning
]
ignore = [
    # Deliberately NOT enabled, each for a reason:
    # PLR    — the "too many X" family. Phase 6 fixes the real
    #          offenders structurally; a threshold that fires on
    #          MainWindow today would just get a blanket noqa.
    # TRY003/EM101/EM102 — findings that would each add a module-level
    #          exception subclass or an intermediate variable. This
    #          codebase's error strings are user-facing and read well
    #          inline; churning them buys nothing.
    "COM812",  # conflicts with the existing trailing-comma style
    # S101 (assert): every real src/ finding read individually (not
    # sampled) and confirmed to narrow a type/logic invariant, never
    # validate user input or an external response — python -O stripping
    # is always safe. See docs/HISTORY.md#115 (§4.8.5) for the sampling.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Qt overrides are camelCase by framework contract, not by choice.
"src/seeker/ui/*" = ["N802"]
# PLC0415/S105/S106: every real tests/* finding sampled/read and
# confirmed to be a deliberate pytest per-test import or a synthetic
# fixture value, never an accident or a real credential — src/'s own
# findings are checked and scoped separately below, not covered by this
# blanket ignore. See docs/HISTORY.md#115 (§4.8.2/§4.8.4) for the
# sampling.
"tests/*" = ["PLC0415", "S105", "S106"]
# NAME-only false positives (S105 fires on the ASSIGNMENT TARGET name
# containing "token"/"password", regardless of the value): TOKEN_URL is
# a URL, not a credential.
"src/seeker/spotify/auth.py" = ["S105"]
# SLSKD_NETWORK_PASSWORD_ENV_VAR holds the NAME of an env var
# ("SLSKD_SLSK_PASSWORD"), never a real password value. S603/S607 (see
# the shared justification below) also apply to this file's own
# subprocess calls (docker/docker compose).
"src/seeker/docker_setup.py" = ["S105", "S603", "S607"]
# DATA_LOCATION_SPOTIFY_TOKEN_LABEL/TOOLTIP_*_PASSWORD_FIELD are UI
# copy (a label and two tooltip strings), never a real credential.
"src/seeker/ui/help_text.py" = ["S105"]
# S603/S607 (subprocess: untrusted input / partial executable path):
# every real call site (round 8, §6.6 of the brief, confirmed again
# here) uses the list form — no `shell=True` anywhere in this codebase,
# checked directly. Invoking `docker`, `ffmpeg`, `open`/`explorer`/
# `xdg-open` by bare name relies on PATH, which
# `ensure_full_path_environment()` (application.py) deliberately
# extends for GUI launches — hardcoding an absolute path would break on
# a Homebrew-vs-Docker-Desktop install instead. tests/*'s own two files
# (`sys.executable` against a real repro script under this same repo,
# never external/untrusted input) share the identical reasoning.
"src/seeker/audio_fingerprint.py" = ["S603", "S607"]
"src/seeker/sharing_service.py" = ["S603", "S607"]
"src/seeker/ui/pages/static_pages.py" = ["S603", "S607"]
"src/seeker/ui/wizard.py" = ["S603", "S607"]
"tests/test_lazy_spotify_config.py" = ["S603"]
"tests/test_workers_deadlock_regression.py" = ["S603"]
# S311 (non-cryptographic random): both real uses generate synthetic
# test data (a fake mp3's garbage bytes; a shuffled locked/queued
# download-request status split) — never a security-sensitive value.
"tests/_stress_step4_scale_repro.py" = ["S311"]
"tests/test_audio_fingerprint.py" = ["S311"]
# The six standalone `tests/_*_repro.py` scripts (leading underscore —
# not collected as test modules, run only as a subprocess; see each
# one's own docstring) share a documented pattern: monkeypatch
# platformdirs/os.environ (QT_QPA_PLATFORM, a throwaway data dir, a
# fake cached token) BEFORE importing Qt/seeker, specifically so the
# real import machinery picks up the patched state. Three of the six
# (the _stress_* ones) genuinely trigger E402 on every import after
# that monkeypatch (28 real findings, confirmed individually with a
# freshly-cleared ruff cache — see this entry's own HISTORY note on why
# that check needed a fresh cache); the other three don't (their
# monkeypatch shape doesn't trip E402 at all). One glob covering the
# whole documented category reads better than a mix of real and
# no-longer-needed inline noqas across six near-identical scripts.
"tests/_*.py" = ["E402"]

[tool.ruff.lint.pep8-naming]
# Belt and braces for the same Qt point, for any file outside ui/ (none
# currently exist, but this is the safety net if one ever does).
# Confirmed against every real camelCase method definition in
# src/seeker/ui/*.py as of Phase 1 (2026-09-08) — re-derive this list
# if a new Qt override is added under a name not already here.
extend-ignore-names = [
    "closeEvent", "paintEvent", "changeEvent", "showEvent",
    "hideEvent", "resizeEvent", "eventFilter", "sizeHint",
    "minimumSizeHint", "minimumSize", "setGeometry", "heightForWidth",
    "hasHeightForWidth", "expandingDirections", "itemAt", "takeAt",
    "addItem", "count", "setVisible", "horizontalSpacing",
    "verticalSpacing",
]

[tool.mypy]
strict = true

# mutagen ships no type annotations anywhere (no py.typed marker, no
# types-mutagen package on PyPI — confirmed) — every call into it under
# --strict trips disallow_untyped_calls. metadata.py is the one module
# that's inherently mutagen-heavy (TIT2/TPE1/APIC/Picture/MP4Cover/...,
# many call sites per function); scattering a per-line ignore on each
# would be noisier than this one acknowledged, scoped exception.
[[tool.mypy.overrides]]
module = "seeker.metadata"
disallow_untyped_calls = false

# soundfile ships no py.typed marker and no types-soundfile package
# exists on PyPI (confirmed) — unlike mutagen (which does type-check at
# the import level, just not on every call), a bare `import soundfile`
# itself is untyped, so this needs the broader ignore_missing_imports
# rather than metadata.py's narrower disallow_untyped_calls override.
[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

# Same real gap as soundfile above — no py.typed marker, no
# types-pyloudnorm package on PyPI (confirmed).
[[tool.mypy.overrides]]
module = "pyloudnorm"
ignore_missing_imports = true

# Roadmap item 116 (round 8, §14.3.1) — pyobjc-framework-Cocoa ships no
# py.typed marker and no types-pyobjc package exists on PyPI (confirmed);
# same real gap as soundfile/pyloudnorm above, for the AppKit import
# behind _set_dock_icon_visible's Dock-icon activation-policy switch.
[[tool.mypy.overrides]]
module = "AppKit"
ignore_missing_imports = true

# Roadmap item RR1.3 — _build_info_generated.py is gitignored and only
# ever exists on a machine that has run a real packaging build
# (packaging/build_dmg.py writes it; see _build_info.py's own
# docstring). A blanket `# type: ignore` on the import that reads it
# was wrong in BOTH directions depending on which machine ran the type
# check: missing-module errors when absent, "unused ignore" (--strict
# enables warn_unused_ignores) when present. This override is the
# actual fix — clean in both states, not just the one the author's own
# machine happened to be in at the time.
[[tool.mypy.overrides]]
module = "seeker._build_info_generated"
ignore_missing_imports = true
