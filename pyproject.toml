[project]
name = "seeker"
version = "0.1.0"
description = "Personal DJ music library management assistant"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "packaging>=26.3",
    "platformdirs>=4.12.3",
    "pyloudnorm>=0.1.1",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
    "scipy>=1.18.1",
    "shiboken6>=6.11.2",
    "soundfile>=0.14.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
seeker = "seeker.main:main"
seeker-ui = "seeker.main_ui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:seeker.*"]

[dependency-groups]
dev = [
    "dmgbuild>=1.6.7",
    "mypy>=2.3.1,<3",
    "psutil>=7.2.2",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.4,<0.17",
    "scipy-stubs>=1.18.1.0",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — real bugs
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade — this is a 3.13-only project
    "B",      # bugbear — real bug classes
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "SIM",    # simplifications
    "RET",    # return consistency
    "PTH",    # pathlib over os.path
    "DTZ",    # naive datetimes
    "RUF",    # ruff's own
    "S",      # bandit — security
    "PLC", "PLE", "PLW",  # pylint: convention/error/warning
    # Blank lines between definitions — preview-only rules. With
    # explicit-preview-rules each needs its exact code: an "E30"
    # prefix would select none of them.
    "E301", "E302", "E303", "E304", "E305", "E306",
    "G201",   # logger.exception, not .error(..., exc_info=True)
    "TRY400", # an error logged inside `except` carries its traceback
    "PIE790", # no `pass` after a docstring
    "RSE102", # `raise Error`, not `raise Error()`
    "FURB161", # int.bit_count(), not bin(i).count("1")
    "SLF001", # no reaching into another object's private members:
              # the shell calls a page's public methods (HISTORY §162)
]
# A preview-only rule runs only when selected by its exact code above,
# never through a prefix such as "E" or "RUF". Preview mode can still
# change a stable rule's behaviour on a ruff upgrade.
preview = true
explicit-preview-rules = true
ignore = [
    # Deliberately NOT enabled, each for a reason:
    # PLR    — the "too many X" family. Real offenders are fixed
    #          structurally; a threshold that fires on MainWindow
    #          would just get a blanket noqa.
    # TRY003/EM101/EM102 — findings that would each add a module-level
    #          exception subclass or an intermediate variable. This
    #          codebase's error strings are user-facing and read well
    #          inline; churning them buys nothing.
    "COM812",  # conflicts with the existing trailing-comma style
    # S101 (assert): every real src/ finding read individually (not
    # sampled) and confirmed to narrow a type/logic invariant, never
    # validate user input or an external response — python -O stripping
    # is always safe. HISTORY §115 has the reading.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Qt overrides are camelCase by framework contract, not by choice.
"src/seeker/ui/*" = ["N802"]
# PLC0415/S105/S106: every real tests/* finding sampled/read and
# confirmed to be a deliberate pytest per-test import or a synthetic
# fixture value, never an accident or a real credential — src/'s own
# findings are checked and scoped separately below, not covered by this
# blanket ignore. HISTORY §115 has the sampling.
# SLF001: a test inspects the private state it is testing.
"tests/*" = ["PLC0415", "S105", "S106", "SLF001"]
# NAME-only false positives (S105 fires on the ASSIGNMENT TARGET name
# containing "token"/"password", regardless of the value): TOKEN_URL is
# a URL, not a credential.
"src/seeker/spotify/auth.py" = ["S105"]
# SLSKD_NETWORK_PASSWORD_ENV_VAR holds the NAME of an env var
# ("SLSKD_SLSK_PASSWORD"), never a real password value. S603/S607 (see
# the shared justification below) also apply to this file's own
# subprocess calls (docker/docker compose).
"src/seeker/soulseek/docker_setup.py" = ["S105", "S603", "S607"]
# DATA_LOCATION_SPOTIFY_TOKEN_LABEL/TOOLTIP_*_PASSWORD_FIELD are UI
# copy (a label and two tooltip strings), never a real credential.
"src/seeker/ui/help_text.py" = ["S105"]
# S603/S607 (subprocess: untrusted input / partial executable path):
# every real call site uses the list form — no `shell=True` anywhere in
# this codebase. Invoking `docker`, `ffmpeg`, `open`/`explorer`/
# `xdg-open` by bare name relies on PATH, which
# `ensure_full_path_environment()` (application.py) deliberately extends
# for GUI launches — hardcoding an absolute path would break on a
# Homebrew-vs-Docker-Desktop install instead. tests/*'s own two files
# (`sys.executable` against a real repro script under this same repo,
# never external/untrusted input) share the identical reasoning.
"src/seeker/audio/fingerprint.py" = ["S603", "S607"]
"src/seeker/soulseek/sharing_service.py" = ["S603", "S607"]
"src/seeker/ui/pages/static_pages.py" = ["S603", "S607"]
"src/seeker/ui/wizard.py" = ["S603", "S607"]
"tests/test_lazy_spotify_config.py" = ["S603"]
"tests/test_workers_deadlock_regression.py" = ["S603"]
# S311 (non-cryptographic random): both real uses generate synthetic
# test data (a fake mp3's garbage bytes; a shuffled locked/queued
# download-request status split) — never a security-sensitive value.
"tests/repro/_stress_step4_scale_repro.py" = ["S311"]
"tests/test_audio_fingerprint.py" = ["S311"]
# The six standalone `tests/repro/_*_repro.py` scripts (not collected
# as test modules, run only as a subprocess; see each
# one's own docstring) share a documented pattern: monkeypatch
# platformdirs/os.environ (QT_QPA_PLATFORM, a throwaway data dir, a
# fake cached token) BEFORE importing Qt/seeker, specifically so the
# real import machinery picks up the patched state. Three of the six
# (the _stress_* ones) genuinely trigger E402 on every import after
# that monkeypatch (28 real findings, confirmed individually with a
# freshly-cleared ruff cache — see this entry's own HISTORY note on why
# that check needed a fresh cache); the other three don't (their
# monkeypatch shape doesn't trip E402 at all). One glob covering the
# whole documented category reads better than a mix of real and
# no-longer-needed inline noqas across six near-identical scripts.
"tests/repro/*.py" = ["E402"]

[tool.ruff.lint.pep8-naming]
# Belt and braces for the same Qt point, for any file outside ui/ (none
# currently exist, but this is the safety net if one ever does).
# Derived from every real camelCase method definition in
# src/seeker/ui/*.py — re-derive this list if a new Qt override is
# added under a name not already here.
extend-ignore-names = [
    "closeEvent", "paintEvent", "changeEvent", "showEvent",
    "hideEvent", "resizeEvent", "eventFilter", "sizeHint",
    "minimumSizeHint", "minimumSize", "setGeometry", "heightForWidth",
    "hasHeightForWidth", "expandingDirections", "itemAt", "takeAt",
    "addItem", "count", "setVisible", "horizontalSpacing",
    "verticalSpacing",
]

[tool.mypy]
strict = true

# mutagen ships no type annotations anywhere (no py.typed marker, no
# types-mutagen package on PyPI — confirmed) — every call into it under
# --strict trips disallow_untyped_calls. audio/tags.py is the one module
# that's inherently mutagen-heavy (TIT2/TPE1/APIC/Picture/MP4Cover/...,
# many call sites per function); scattering a per-line ignore on each
# would be noisier than this one acknowledged, scoped exception.
[[tool.mypy.overrides]]
module = "seeker.audio.tags"
disallow_untyped_calls = false

# soundfile ships no py.typed marker and no types-soundfile package
# exists on PyPI (confirmed) — unlike mutagen (which does type-check at
# the import level, just not on every call), a bare `import soundfile`
# itself is untyped, so this needs the broader ignore_missing_imports
# rather than audio/tags.py's narrower disallow_untyped_calls override.
[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

# Same real gap as soundfile above — no py.typed marker, no
# types-pyloudnorm package on PyPI (confirmed).
[[tool.mypy.overrides]]
module = "pyloudnorm"
ignore_missing_imports = true

# pyobjc-framework-Cocoa ships no py.typed marker and no types-pyobjc
# package exists on PyPI (confirmed); same real gap as
# soundfile/pyloudnorm above, for the AppKit import behind
# _set_dock_icon_visible's Dock-icon activation-policy switch.
[[tool.mypy.overrides]]
module = "AppKit"
ignore_missing_imports = true

# Same real gap as AppKit above — confirmed live (no py.typed marker,
# no types-pyobjc-framework-ServiceManagement package on PyPI) for
# login_item.py's SMAppService wrapper.
[[tool.mypy.overrides]]
module = "ServiceManagement"
ignore_missing_imports = true

# _build_info_generated.py is gitignored and only ever exists on a
# machine that has run a real packaging build (packaging/build_dmg.py
# writes it; see _build_info.py's own docstring). A blanket `# type:
# ignore` on the import that reads it would be wrong in BOTH directions
# depending on which machine ran the type check: missing-module errors
# when absent, "unused ignore" (--strict enables warn_unused_ignores)
# when present. This override is clean in both states.
[[tool.mypy.overrides]]
module = "seeker._build_info_generated"
ignore_missing_imports = true
