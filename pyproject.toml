[project]
name = "seeker"
version = "0.1.0"
description = "Personal DJ music library management assistant"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.2",
    "packaging>=26.3",
    "platformdirs>=4.11.4",
    "pyloudnorm>=0.1.1",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
seeker = "seeker.main:main"
seeker-ui = "seeker.main_ui:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:seeker.*"]

[dependency-groups]
dev = [
    "dmgbuild>=1.6.7",
    "mypy>=2.3.1,<3",
    "psutil>=7.2.2",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.4,<0.17",
    "scipy-stubs>=1.18.1.0",
]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — real bugs
    "E", "W", # pycodestyle
    "I",      # import sorting
    "UP",     # pyupgrade — this is a 3.13-only project
    "B",      # bugbear — real bug classes
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "SIM",    # simplifications
    "RET",    # return consistency
    "PTH",    # pathlib over os.path
    "DTZ",    # naive datetimes
    "RUF",    # ruff's own
    "S",      # bandit — security
    "PLC", "PLE", "PLW",  # pylint: convention/error/warning
]
ignore = [
    # Deliberately NOT enabled, each for a reason:
    # PLR    — the "too many X" family. Phase 6 fixes the real
    #          offenders structurally; a threshold that fires on
    #          MainWindow today would just get a blanket noqa.
    # TRY003/EM101/EM102 — findings that would each add a module-level
    #          exception subclass or an intermediate variable. This
    #          codebase's error strings are user-facing and read well
    #          inline; churning them buys nothing.
    "COM812",  # conflicts with the existing trailing-comma style
]

[tool.ruff.lint.per-file-ignores]
# Qt overrides are camelCase by framework contract, not by choice.
"src/seeker/ui/*" = ["N802"]
# Tests assert; that is their job.
"tests/*" = ["S101"]

[tool.ruff.lint.pep8-naming]
# Belt and braces for the same Qt point, for any file outside ui/ (none
# currently exist, but this is the safety net if one ever does).
# Confirmed against every real camelCase method definition in
# src/seeker/ui/*.py as of Phase 1 (2026-09-08) — re-derive this list
# if a new Qt override is added under a name not already here.
extend-ignore-names = [
    "closeEvent", "paintEvent", "changeEvent", "showEvent",
    "hideEvent", "resizeEvent", "eventFilter", "sizeHint",
    "minimumSizeHint", "minimumSize", "setGeometry", "heightForWidth",
    "hasHeightForWidth", "expandingDirections", "itemAt", "takeAt",
    "addItem", "count", "setVisible", "horizontalSpacing",
    "verticalSpacing",
]

[tool.mypy]
strict = true

# mutagen ships no type annotations anywhere (no py.typed marker, no
# types-mutagen package on PyPI — confirmed) — every call into it under
# --strict trips disallow_untyped_calls. metadata.py is the one module
# that's inherently mutagen-heavy (TIT2/TPE1/APIC/Picture/MP4Cover/...,
# many call sites per function); scattering a per-line ignore on each
# would be noisier than this one acknowledged, scoped exception.
[[tool.mypy.overrides]]
module = "seeker.metadata"
disallow_untyped_calls = false

# soundfile ships no py.typed marker and no types-soundfile package
# exists on PyPI (confirmed) — unlike mutagen (which does type-check at
# the import level, just not on every call), a bare `import soundfile`
# itself is untyped, so this needs the broader ignore_missing_imports
# rather than metadata.py's narrower disallow_untyped_calls override.
[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

# Same real gap as soundfile above — no py.typed marker, no
# types-pyloudnorm package on PyPI (confirmed).
[[tool.mypy.overrides]]
module = "pyloudnorm"
ignore_missing_imports = true

# Roadmap item RR1.3 — _build_info_generated.py is gitignored and only
# ever exists on a machine that has run a real packaging build
# (packaging/build_dmg.py writes it; see _build_info.py's own
# docstring). A blanket `# type: ignore` on the import that reads it
# was wrong in BOTH directions depending on which machine ran the type
# check: missing-module errors when absent, "unused ignore" (--strict
# enables warn_unused_ignores) when present. This override is the
# actual fix — clean in both states, not just the one the author's own
# machine happened to be in at the time.
[[tool.mypy.overrides]]
module = "seeker._build_info_generated"
ignore_missing_imports = true
