[project]
name = "seeker"
version = "0.1.0"
description = "Personal DJ music library management assistant"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
seeker = "seeker.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
