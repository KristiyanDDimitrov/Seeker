# Seeker's slskd template. Seeker copies it into each user's slskd data
# directory and runs `docker compose up` against that copy; the tracked
# file is never edited by the app.
#
# Every value below comes from the environment `docker compose up` runs
# with (docker_setup.bring_up_slskd). Nothing names one machine's paths:
# SLSKD_DATA_DIR and SLSKD_SHARE_PATH are required, so a missing value
# fails loudly instead of mounting someone else's folder.
#
# The credential variables may be empty for a manual run: slskd then
# keeps whatever its own slskd.yml already holds (HISTORY §23).

# Fixed, so the project is the same whichever directory the file is
# run from (the repository or Seeker's per-user copy).
name: seeker

services:
  slskd:
    image: slskd/slskd:0.26.0
    container_name: slskd
    ports:
      # The web UI and API answer on this machine only; Seeker talks to
      # slskd over localhost. HISTORY §116.
      - "127.0.0.1:5030:5030"
      - "127.0.0.1:5031:5031"
      # Soulseek peers connect in on this port, so it stays published on
      # every interface.
      - "50300:50300"
    environment:
      - PUID=1000
      - PGID=1000
      # Share directories change only by recreating the container from
      # this file (sharing_service.py), never through slskd's remote
      # configuration API.
      - SLSKD_REMOTE_CONFIGURATION=false
      # The Soulseek network login.
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      # The web UI login, distinct from the network login above.
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
    volumes:
      - "${SLSKD_DATA_DIR:?set by Seeker}:/app"
      - "${SLSKD_SHARE_PATH:?set by Seeker}:/shared/music:ro"
    restart: unless-stopped
