# SLSKD_SLSK_USERNAME/SLSKD_SLSK_PASSWORD/SLSKD_API_KEY are populated by
# the onboarding wizard (Application/docker_setup.py) via the
# environment `docker compose up` is invoked with — never written to a
# second, compose-specific env file. Confirmed live (2026-08-28) safe
# to leave unset for a manual `docker compose up`: slskd falls through
# to whatever's already persisted in slskd-data/slskd.yml when an
# env var override is empty, rather than clobbering it (verified
# against a real persisted credential before relying on this).
# SLSKD_DATA_DIR/SLSKD_SHARE_PATH default to this repo's existing real
# values so a manual run without the wizard behaves exactly as before.
services:
  slskd:
    image: slskd/slskd
    container_name: slskd
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
    environment:
      - PUID=1000
      - PGID=1000
      # Roadmap item 116 (round 8, §6.1.3) — checked, not assumed: grep
      # for api/v0/options, api/v0/config, and remote_configuration
      # across src/ turns up nothing calling slskd's remote config API
      # (SharingService.add_location_to_share's own comment records that
      # PATCH /api/v0/options was tried for share-path changes and found
      # unusable — it recreates the container via bring_up_slskd
      # instead, a compose-level change, not a remote-configuration
      # one). slskd defaults this to false; there was never a reason it
      # was true here.
      - SLSKD_REMOTE_CONFIGURATION=false
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
    volumes:
      - ${SLSKD_DATA_DIR:-./slskd-data}:/app
      - "${SLSKD_SHARE_PATH:-/Volumes/X9 Pro/Music}:/shared/music:ro"
      - "/Volumes/X9 Pro/Music/Test:/shared/Test:ro"
    restart: always
